<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your saved countries on MoveAbroad." />
    <title>MoveAbroad | My Favorites</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/favorites.js" type="module"></script>
  </head>

  <body>
    <header id="main-header"></header>

    <main>
      <section class="intro">
        <h1>My favorite countries</h1>
        <p>
          These are the countries you saved. They stay saved in this browser.
        </p>
      </section>

      <p class="results-count" id="favorites-count" aria-live="polite"></p>
      <ul class="country-list" id="favorites-list"></ul>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
